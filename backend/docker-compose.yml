

services:
  backend:
    build:
      context: .

    container_name: securevote_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started

    networks:
      - securevote_network

  db:
    image: postgres:16

    container_name: securevote_db

    restart: always

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 60s

    networks:
      - securevote_network

  redis:
    image: redis:7-alpine

    container_name: securevote_redis

    restart: always

    ports:
      - "6379:6379"

    networks:
      - securevote_network

volumes:
  postgres_data:

networks:
  securevote_network: